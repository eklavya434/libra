[project]
name = "libra"
version = "0.1.0"
description = "Personal LLM Laboratory + ChatGPT-Like AI Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Libra Project Authors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psutil>=6.0.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "tokenizers>=0.19.0",
    "transformers>=4.40.0",
    "tqdm>=4.66.0",
    "safetensors>=0.4.0",
    "regex>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E731", "E741", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
