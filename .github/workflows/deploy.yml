name: Deploy Libra (Render)

# Continuous deployment for the production services described in render.yaml
# (backend) plus the Vercel-hosted frontend.
#
# What you need to enable this:
#   1. Frontend (Vercel): import the repo at https://vercel.com -> Project
#      (framework Next.js). Vercel auto-deploys every push to `main`; set the
#      optional `NEXT_PUBLIC_API_URL` only if the `/api/*` rewrite destination
#      (see vercel.json) ever changes. No secret is needed here.
#   2. Backend (Render): connect the repository via the dashboard (New ->
#      Blueprint) which auto-deploys on every push to `main` WITHOUT any tokens
#      (owner action).
#   3. OPTIONAL belt-and-suspenders: add a repository secret `RENDER_DEPLOY_HOOK`
#      (Services -> libra-backend -> Deploy -> Deploy Hook URL). This workflow
#      then fires the hook explicitly. Without the secret the workflow still
#      succeeds (Render's built-in auto-deploy covers it).

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Trigger Render deploy hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fire backend deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" || echo "Deploy hook not reachable - Render auto-deploy still applies"