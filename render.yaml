# ==============================================================================
# LIBRA RENDER BLUEPRINT (zero-cost managed deployment, FREE tier compatible)
#
# Render watches the connected GitHub repository and auto-deploys this file's
# services on every push to `main`. No CLI or tokens are required for deploys —
# only a GitHub app connection made once in the Render dashboard (owner action).
#
# Free-tier reality (verified 2026):
#   - Free web services sleep after 15 min of inactivity and cold-start in ~1 min.
#   - Free web services CANNOT attach persistent disks. The filesystem is
#     ephemeral: any local SQLite/uploads reset on every redeploy/restart.
#     Durable data therefore lives in Supabase (see ./supabase/): set
#     DATABASE_URL so conversations persist across deploys (PostgresConversation
#     Store, schema at supabase/migrations/0001_conversation_store.sql), and
#     SUPABASE_URL + a key so uploads land in a storage bucket.
#   - Free = 0.1 CPU / 512 MB RAM. Cloud-provider model calls (Gemini/NVIDIA)
#     are network-bound, so the low CPU is fine; local Ollama models stay on
#     the owner's PC.
#
# Frontend note: the public frontend lives on Vercel (yet another single URL
# requirement). vercel.json rewrites /api/:path* on the SAME origin to this
# backend, so the browser never needs CORS here. CORS_ORIGINS below is kept for
# direct deep-links / debugging only.
# ==============================================================================

services:
  - type: web
    name: libra-backend
    runtime: docker
    repo: https://github.com/eklavya434/libra
    branch: main
    dockerfilePath: infra/docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LIBRA_ENV
        value: production
      - key: LIBRA_HOST
        value: 0.0.0.0
      - key: LIBRA_PORT
        value: "8000"
      - key: LIBRA_LEARNING_MODE
        value: "true"
      - key: LIBRA_PUBLIC_CODE_EXEC
        value: "false"
      - key: LIBRA_SESSION_TTL_DAYS
        value: "30"
      - key: LIBRA_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: LIBRA_RATE_LIMIT_BURST
        value: "30"
      # Same-origin /api/* proxy on Vercel means the browser never hits this
      # origin directly; the list below just keeps curl/debug flows working.
      - key: CORS_ORIGINS
        value: '["https://libra-frontend.vercel.app","http://localhost:3000"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Durability (Supabase free tier). Set these in the Render dashboard.
      #   - DATABASE_URL: postgres://... for durable conversations
      #   - SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY: object storage
      #   - SUPABASE_STORAGE_BUCKET: default "libra-files"
      # Optional Supabase Auth (enables JWT sessions on top of guests):
      #   - LIBRA_SUPABASE_AUTH_ENABLED: "true"
      #   - SUPABASE_JWT_SECRET / SUPABASE_JWT_AUDIENCE
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: libra-files
      - key: LIBRA_SUPABASE_AUTH_ENABLED
        value: "false"
      - key: LIBRA_DEPLOY_ENV
        value: render